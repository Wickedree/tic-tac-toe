<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <h1>Let's Play: Tic Tac Toe!</h1>
    
    <div class="page-main-container">
         <div id="player-panel">
             <input type="text" id="playerOne" placeholder="Enter player 1 name...">
             <input type="text" id="playerTwo" placeholder="Enter player 2 name...">
             <button id="start-game-btn">Start Game</button>
             <button id="restart-game-btn">Restart Game</button>
         </div>

         <div id="gameboard">

         </div>
         
         <div class="result-turns-display-container">
             <div id="message"></div>
             <div id="result-display"></div>
         </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
